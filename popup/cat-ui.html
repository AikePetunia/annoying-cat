<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="root.css" />
  </head>

  <body>
    <!-- Header -->
    <div class="g__header-container">
      <div>
        <label class="g__toggl-extension">
          <input type="checkbox" class="g__toggl-checkbox" id="global-extension-enable" name="enabled" />
          <span class="g__toggl-slider"></span>
        </label>
        <span class="g__extension-toggle-text">Cat won't disturb.</span>
      </div>
      <div>
        <!-- Icon changes if u are on a social media -->
        <img src="../icons/annoying-cat-32-white.avif" id="g__sm-icon" width="32" height="32" alt="Annoying Cat Icon" />
      </div>
    </div>

    <!-- Global settings -->
    <div class="separator"></div>
    <div class="global-settings hidden">
      <h5>Global settings</h5>
      <div>         
        <input type="checkbox" id="global-blocksocialmedia" name="blocksocialmedia" />
        <label for="global-blocksocialmedia">Completly block All social media <span class="g__block-not-here hidden">(this doesn't affect here)</span></label>
      </div>
      <div>
        <input type="checkbox" id="global-grayscale" name="grayscale" />
        <label for="global-grayscale">Grayscale mode</label>
      </div>

      <div>
        <input type="checkbox" id="global-cat-suggestions" name="suggestions" />
        <label for="global-cat-suggestions">Allow suggestions from the cat</label>
      </div>
    </div>

     <!-- Keywords -->
     <div class="kw__container hidden">
      <div>
        <input type="checkbox" id="global-keywords-enabled" name="keywordsEnabled" />
        <label for="global-keywords-enabled">Hide content that contains these words:</label>
      </div>
      <div class="kw__input">
        <input type="text" name="" id="inp1">
        <button id="create">Add keyword</button>
        <div id="kw__added-container"></div>
      </div>
      <div class="separator"></div>
    </div>

    <!-- Default State -->
    <div class="nothing-to-hide ">
      <h1>Nothing to hide!</h1>
      <img src="../icons/annoying-cat-32-white.avif" width="128" height="128" alt="Cat Icon" />
    </div>

    <!-- Twitter / X -->
    <div class="sm__configs twitter ">
      <h5> Twitter Settings </h5>
      <div>
        <input type="checkbox" id="only-following-tw" name="twitter.onlyFollowing" />
        <label for="only-following-tw">Only following</label>
      </div>

      <div>
        <input type="checkbox" id="remove-stuff-tw" name="twitter.removeUnnecessary" />
        <label for="remove-stuff-tw">Remove unnecessary buttons</label>
      </div>


      <div>
        <input type="checkbox" id="remove-metrics-tw" name="twitter.removeMetrics" />
        <label for="remove-metrics-tw">Remove metrics</label>
      </div>

      <div>
        <input type="checkbox" id="tweets-limit-tw" name="twitter.tweetsLimitEnabled" />
        <select name="twitter.tweetsLimitPeriod" id="limit-period-tw">
          <option value="daily">Daily</option>
          <option value="hourly">Hourly</option>
        </select>
        <label for="tweets-limit-tw">Tweets limit</label>
        <input 
        class="post-limit-input-ig" 
        type="text" 
        inputmode="numeric" 
        name="twitter.tweetsLimit"
        data-min="0" 
        data-max="99"
      />
      </div>
    </div>

    <!-- Instagram -->
    <div class="sm__configs instagram hidden">
      <h5> Instagram Settings </h5>
      <div>
        <input type="checkbox" id="remove-stuff-ig" name="instagram.removeUnnecessary" />
        <label for="remove-stuff-ig">Remove unnecessary buttons</label>
      </div>

      <div>
        <input type="checkbox" id="hide-comments-ig" name="instagram.hideComments" />
        <label for="hide-comments-ig">Hide comments</label>
      </div>

      <div>
        <input type="checkbox" id="hide-metrics-ig" name="instagram.hideMetrics" />
        <label for="hide-metrics-ig">Hide metrics (likes, comments, reposts)</label>
      </div>

      <div>
        <input type="checkbox" id="block-reels-ig" name="instagram.blockReels" />
        <label for="block-reels-ig">Block reels</label>
      </div>

      <div>
        <input type="checkbox" id="remove-posts-ig" name="instagram.removePosts" />
        <label for="remove-posts-ig">Remove posts</label>
      </div>

      <div data-hidden-when="instagram.removePosts">
        <input type="checkbox" id="posts-limit-ig" name="instagram.postsLimitEnabled" />
        <select name="instagram.postsLimitPeriod" id="limit-period-posts-ig">
          <option value="daily">Daily</option>
          <option value="hourly">Hourly</option>
        </select>
        <label for="posts-limit-ig">Posts limit</label>
        <input 
          class="post-limit-input-ig" 
          type="text" 
          inputmode="numeric" 
          name="instagram.postsLimit"
          data-min="0" 
          data-max="99"
        />

      </div>

      <div>
        <input type="checkbox" id="remove-stories-ig" name="instagram.removeStories" />
        <label for="remove-stories-ig">Remove stories</label>
      </div>

      <div data-hidden-when="instagram.removeStories">
        <input type="checkbox" id="story-limit-ig" name="instagram.storyLimitEnabled" />
        <select name="instagram.storyLimitPeriod" id="limit-period-stories-ig">
          <option value="daily">Daily</option>
          <option value="hourly">Hourly</option>
        </select>
        <label for="story-limit-ig">Stories limit</label>
        <input 
        class="story-limit-input-ig" 
        type="text" 
        inputmode="numeric" 
        name="instagram.storyLimit"
        data-min="0" 
        data-max="99"
      />

      </div>
    </div>

    <!-- Youtube -->
    <div class="sm__configs youtube hidden">
      <h5> Youtube Settings </h5>
      <div>
        <input type="checkbox" id="block-shorts-yt" name="youtube.blockShorts" />
        <label for="block-shorts-yt">Block shorts</label>
      </div>

      <div>
        <input type="checkbox" id="hide-comments-yt" name="youtube.hideComments" />
        <label for="hide-comments-yt">Hide comments</label>
      </div>

      <div>
        <input type="checkbox" id="hide-metrics-yt" name="youtube.hideMetrics" />
        <label for="hide-metrics-yt">Hide metrics (likes, views, subscribers)</label>
      </div>

      <div data-hidden-when="youtube.blockShorts">
        <input type="checkbox" id="shorts-limit-yt" name="youtube.shortsLimitEnabled" />
        <select name="youtube.shortsLimitPeriod" id="limit-period-shorts-yt">
          <option value="daily">Daily</option>
          <option value="hourly">Hourly</option>
        </select>
        <label for="shorts-limit-yt">Shorts limit</label>
          <input 
          class="shorts-limit-input-yt" 
          type="text" 
          inputmode="numeric" 
          name="youtube.shortsLimit"
          data-min="0" 
          data-max="99"
        />
      </div>
    </div>

   
    <!-- Footer -->
    <div class="ft__credits-container">
      <div class="separator"></div>
      <div >
        <p style="margin: 0;"> Not blocking a damn thing?  </p>
         <a style="margin: 0;" href="https://github.com/AikePetunia/annoying-cat/issues/new" target="_blank"> let me know! </a> 
      </div>
      <div>
      <a href="https://github.com/AikePetunia/annoying-cat" target="_blank">Open Source</a>
       <h6 class="ft__credits-of-awesome-person">
        Developed By <a href="https://aike.tech/" target="_blank">Aike</a>
        <img src="../icons/eye.gif" width="20" height="20" alt="Eye GIF" />
      </h6>
      </div>
     
    </div>

    <script src="cat-ui.mjs" type="module"></script>
  </body>
</html>
